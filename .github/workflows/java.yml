name: Verificar Java
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compilar
        run: javac -encoding UTF-8 --release 17 -Xlint:all -d bin src/conectacampus/*.java test/conectacampus/*.java
      - name: Probar
        run: java -cp bin conectacampus.RedSocialTest
      - name: Ejecutar ejemplo
        run: java -cp bin conectacampus.Main --demo
